<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Babel Standalone lets preview-templates.js below be written as
       plain JSX and transpiled in the browser, so custom previews
       don't need a bundler added to this otherwise build-free admin
       setup. -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- decap-cms.js exposes window.h (= its own bundled React's
       createElement) and window.createClass, but never window.React
       itself — confirmed by inspecting the actual unpkg-served bundle,
       not assumed. Babel's JSX transpile always emits calls to
       `React.createElement(...)`, so without this shim any preview
       component reaching a JSX return throws "React is not defined" —
       registering the template itself doesn't error (the JSX body only
       runs when Decap actually renders that component), which is why
       this only surfaces once an editor opens a real entry. Aliasing
       the *same* createElement decap-cms.js already uses (rather than
       loading a separate React/ReactDOM bundle) also avoids ending up
       with two different React instances on the page. -->
  <script>
    window.React = window.React || { createElement: window.h };
  </script>

  <!-- Compiled Tailwind output for the preview pane, built from the
       site's own globals.css by `npm run build:preview-css` (wired
       into `npm run build` — see package.json) so preview templates
       can reuse the same utility classes and design tokens (colors,
       .label, .display-serif, etc.) as the real site components. -->
  <script>
    CMS.registerPreviewStyle("/admin/preview.css");
  </script>

  <!-- Auto-fills `order` with the current timestamp (ms) the first
       time a brand-new entry is saved, across all 9 collections — the
       "Display Order" number field now holds a Date.now()-style value
       instead of a manually-picked small integer, and
       readOrderedContent() (src/lib/orderedContent.ts) sorts it
       descending, so newer entries surface first without an editor
       ever having to enter a number themselves.
       entry.get('newRecord') is a real Decap CMS entry-state flag
       (confirmed by inspecting the unpkg-served bundle), true only for
       an entry that has never been saved before — this guards against
       re-stamping (and reordering) an entry on every subsequent edit.
       Also guarded on the field being empty, so a value an editor
       entered manually is never overwritten. -->
  <script>
    CMS.registerEventListener({
      name: "preSave",
      handler: ({ entry }) => {
        var data = entry.get("data");
        if (entry.get("newRecord") && !data.get("order")) {
          return data.set("order", Date.now());
        }
        return data;
      },
    });
  </script>

  <!-- Custom preview components, registered per collection. Babel
       Standalone doesn't read a config file (no filesystem access in
       the browser), so the react preset has to be named explicitly
       here rather than assumed. -->
  <script type="text/babel" data-presets="react" src="/admin/preview-templates.js"></script>

  <!-- "사용 가이드" modal + button, shown once automatically on first
       login and reopenable anytime after — see guide.js for why this
       has to be plain DOM manipulation rather than a CMS API call. -->
  <script src="/admin/guide.js"></script>
</body>
</html>
