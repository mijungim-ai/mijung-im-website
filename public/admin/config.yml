backend:
  name: git-gateway
  repo: mijungim-ai/mijung-im-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b77775fc-d3f9-47bb-bf94-58465448378b/pkce
  auth_token_endpoint: /sites/b77775fc-d3f9-47bb-bf94-58465448378b/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" – {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" – {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} – {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Default upload target for new media added through the CMS. Existing
# curated photos (concert-archive posters, gallery, etc.) stay in their
# own public/images/* folders via per-field overrides below — this is
# only the fallback for brand-new uploads.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://hilarious-syrniki-c611de.netlify.app

# Collection order below = CMS sidebar order (final spec, 2026-08-27).
# Projects — Featured Photo is deliberately NOT listed here (hidden
# from the CMS menu) — content/featured-photo.json and the site code
# reading it are untouched and still render on Home/Projects; see
# docs/TODO.md.
collections:
  - name: home_news
    label: "Home — Latest News"
    label_singular: "News Item"
    folder: content/home-news
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, title]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - { name: title, label: Title, widget: string }
      - { name: body, label: Content, widget: text }
      - name: image
        label: Image
        widget: image
        required: false
        media_folder: "/public/images/home-news"
        public_folder: "/images/home-news"

  - name: engagements
    label: "Performances — Selected Engagements"
    label_singular: Engagement
    folder: content/engagements
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, title]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - { name: title, label: Title, widget: string }
      - name: dateLabel
        label: "Date Label"
        widget: string
        hint: 'e.g. "Sunday, March 28, 2027 at 7:00 pm" or "March 2027"'
      - { name: location, label: Location, widget: string }
      - { name: content, label: Content, widget: text, required: false }
      - name: image
        label: Image
        widget: image
        required: false
        media_folder: "/public/images/engagements"
        public_folder: "/images/engagements"
      - name: link
        label: Link
        widget: object
        required: false
        fields:
          - { name: href, label: URL, widget: string }
          - { name: label, label: "Link Label", widget: string }

  - name: concert_archive
    label: "Performances — Concert Archive"
    label_singular: Concert
    folder: content/concert-archive
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, date]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first (newest concerts first)."
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: string, hint: 'e.g. "2021" or a full date.' }
      - { name: location, label: Location, widget: string }
      - name: content
        label: Content
        widget: text
        required: false
        hint: "Program notes or other additional details."
      - name: image
        label: "Poster Image"
        widget: image
        required: false
        media_folder: "/public/images/archive"
        public_folder: "/images/archive"
      - name: link
        label: Link
        widget: object
        required: false
        fields:
          - { name: href, label: URL, widget: string }
          - { name: label, label: "Link Label", widget: string }

  - name: videos_performances
    label: "Media — Video (Performances)"
    label_singular: "Performance Video"
    folder: content/videos-performances
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, title]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - { name: title, label: Title, widget: string, required: false }
      - { name: body, label: Description, widget: text, required: false }
      - name: embedUrl
        label: "YouTube Embed URL"
        widget: string
        hint: "e.g. https://www.youtube.com/embed/VIDEO_ID"

  - name: videos_talks
    label: "Media — Video (Talks & Interviews)"
    label_singular: "Talk/Interview Video"
    folder: content/videos-talks
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, title]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - name: title
        label: Title
        widget: string
        required: false
        hint: 'Usually "Talk" or "Interview".'
      - { name: body, label: Description, widget: text, required: false }
      - name: embedUrl
        label: "YouTube Embed URL"
        widget: string
        hint: "e.g. https://www.youtube.com/embed/VIDEO_ID"

  - name: media_gallery
    label: "Media — Gallery"
    label_singular: "Gallery Photo"
    folder: content/media-gallery
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - name: caption
        label: Caption
        widget: string
        hint: "Also used as the photo's alt text for accessibility."
      - name: image
        label: Photo
        widget: image
        media_folder: "/public/images/gallery"
        public_folder: "/images/gallery"

  - name: press_articles
    label: "Dialogue — Press"
    label_singular: "Press Article"
    folder: content/press-articles
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first (newest articles first)."
      - { name: title, label: Title, widget: string }
      - { name: url, label: URL, widget: string }

  - name: essays
    label: "Dialogue — Essays & Director's Letters"
    label_singular: Essay
    folder: content/essays
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, title]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date
        widget: string
        required: false
        hint: "Optional — for dated festival director's notes only."
      - name: image
        label: Image
        widget: image
        required: false
        media_folder: "/public/images/essays"
        public_folder: "/images/essays"
      - name: body
        label: "Body Text"
        widget: text
        required: false
        hint: 'Fill in Body Text OR External URL below, not both. Use this for the full text shown directly on the page.'
      - name: externalUrl
        label: "External URL"
        widget: string
        required: false
        hint: "Fill in External URL OR Body Text above, not both. Use this to link out to the original article/post instead."

  - name: projects_gallery
    label: "Projects — Gallery"
    label_singular: "Gallery Photo"
    folder: content/projects-gallery
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - name: caption
        label: Caption
        widget: string
        hint: "Also used as the photo's alt text for accessibility."
      - name: image
        label: Photo
        widget: image
        media_folder: "/public/images/projects"
        public_folder: "/images/projects"
