backend:
  name: git-gateway
  repo: mijungim-ai/mijung-im-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b77775fc-d3f9-47bb-bf94-58465448378b/pkce
  auth_token_endpoint: /sites/b77775fc-d3f9-47bb-bf94-58465448378b/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" – {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" – {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} – {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Default upload target for new media added through the CMS. Existing
# curated photos (concert-archive posters, gallery, etc.) stay in their
# own public/images/* folders via per-field overrides below — this is
# only the fallback for brand-new uploads.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://hilarious-syrniki-c611de.netlify.app

# Step 1 of the 9-board migration: only Performances/Selected Engagements,
# Performances/Concert Archive, and Dialogue/Press are wired to real
# content/*/*.json folder collections (see src/data/engagements.ts,
# concertArchive.ts, pressArticles.ts and docs/TODO.md). The other 6
# boards (Media Video x2, Media Gallery, Dialogue Essays/Director's
# Letters, Projects Gallery, Projects Featured Photo) are still
# hardcoded arrays and intentionally left out of collections below —
# they're a separate later step, not yet agreed on.
collections:
  - name: engagements
    label: "Performances — Selected Engagements"
    label_singular: Engagement
    folder: content/engagements
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, title]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first."
      - { name: title, label: Title, widget: string }
      - name: dateLabel
        label: "Date Label"
        widget: string
        hint: 'e.g. "Sunday, March 28, 2027 at 7:00 pm" or "March 2027"'
      - { name: location, label: Location, widget: string }

  - name: concert_archive
    label: "Performances — Concert Archive"
    label_singular: Concert
    folder: content/concert-archive
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order, year]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first (newest concerts first)."
      - name: image
        label: "Poster Image"
        widget: image
        media_folder: "/public/images/archive"
        public_folder: "/images/archive"
      - { name: year, label: Year, widget: string }
      - { name: title, label: Title, widget: string }
      - { name: venue, label: Venue, widget: string, required: false }
      - { name: program, label: Program, widget: text, required: false }

  - name: press_articles
    label: "Dialogue — Press"
    label_singular: "Press Article"
    folder: content/press-articles
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    sortable_fields: [order]
    fields:
      - name: order
        label: "Display Order"
        widget: number
        hint: "Lower numbers show first (newest articles first)."
      - { name: title, label: Title, widget: string }
      - { name: url, label: URL, widget: string }

  - name: placeholder
    label: "Placeholder (remaining 6 boards — TBD)"
    folder: content/_placeholder
    create: false
    fields:
      - { name: title, label: Title, widget: string }
